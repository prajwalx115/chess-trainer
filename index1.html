<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chess Build</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="index1.css">
</head>
<body>
<!-- ══ NAV ══ -->
<nav>
  <a class="nav-brand" href="#">
    <span class="nav-pawn">♟</span>
    <span class="nav-name">Chess <span>Build</span></span>
  </a>

  <div class="nav-btns">
    <button class="btn-dark" onclick="openModal('login')">Sign In</button>
    <button class="btn-dark" onclick="openModal('signup')">Join Free</button>
  </div>
</nav>

<!-- ══ HERO ══ -->
<section class="hero">
  <div class="hero-label">Welcome</div>

  <h1 class="hero-h1">
    <div class="line1">Chess</div>
    <div class="line2">Build</div>
  </h1>

  <p class="hero-sub">
    Learn, Play, Explore in chess......
  </p>
  <div class="hero-ctas">
    <div>
    <a class="cta-outline" href="index2/index2.html">
      Games
    </a>
    </div><br><br>
    <div>    
    <a class="cta-outline" href="index3/index3.html">
      Tutorials
    </a>
    </div>
    <div>    
    <a class="cta-outline" href="Pieces/Piece.html">
      Learn some pieces.
    </a>
    </div>
  </div>

  <div class="ornament">
    <div class="ornament-line"></div>
    <span class="ornament-crown">♛</span>
    <div class="ornament-line r"></div>
  </div>

<!-- ══ AUTH MODAL ══ -->
<div class="overlay" id="authOverlay" onclick="overlayClick(event)">
  <div class="modal">
    <button class="modal-x" onclick="closeModal()">✕</button>
    <div class="modal-inner">
      <div class="modal-icon">♚</div>
      <div class="modal-title">Chess Build</div>
      <div class="modal-tagline">Begin journey to greatness</div>

      <div class="tabs">
        <button class="tab-btn active" id="t-login" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" id="t-signup" onclick="switchTab('signup')">Create Account</button>
      </div>

      <!-- LOGIN -->
      <div class="mform" id="f-login">
        <div>
          <label class="flabel">Email or Username</label>
          <input class="finput" type="text" placeholder="username"/>
        </div>
        <div>
          <label class="flabel">Password</label>
          <input class="finput" type="password" placeholder="••••••••"/>
        </div>
        <button class="fsubmit">Enter the Board →</button>
        <p class="fswitch">No account? <span onclick="switchTab('signup')">Join for free</span></p>
      </div>

      <!-- SIGNUP -->
      <div class="mform hidden" id="f-signup">
        <div>
          <label class="flabel">Username</label>
          <input class="finput" type="text" placeholder="DeepKnight99"/>
        </div>
        <div>
          <label class="flabel">Email Address</label>
          <input class="finput" type="email" placeholder="your@email.com"/>
        </div>
        <div>
          <label class="flabel">Password</label>
          <input class="finput" type="password" placeholder="Min. 8 characters"/>
        </div>
        <div>
          <label class="flabel">Confirm Password</label>
          <input class="finput" type="password" placeholder="Repeat password"/>
        </div>
        <button class="fsubmit">Claim Your Square →</button>
        <p class="fswitch">Already a member? <span onclick="switchTab('login')">Sign in</span></p>
      </div>
    </div>
  </div>
</div>

<script src="index1.js">
</script>
</body>
</html>
